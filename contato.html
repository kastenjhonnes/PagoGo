<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PagoGo - Contato &amp; Roteiro Personalizado</title>
    <link rel="stylesheet" href="assets/css/global.css">
</head>
<body>

    <header class="header-main">
        <div class="container header-container">
            <a href="index.html" class="logo">Pago<span>Go</span></a>
            <nav class="nav-menu" aria-label="Menu principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="rotas.html">Explorar Rotas</a></li>
                    <li><a href="contato.html" class="active">Contato &amp; Suporte</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-padding">
        <section class="form-section">
            <div class="form-container">
                <h1>Solicite um Roteiro Personalizado</h1>
                <p>Preencha os dados abaixo para receber sugestões de rotas otimizadas por e-mail.</p>

                <form class="main-form" action="#" method="POST">
                    <div class="form-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail de Contato:</label>
                        <input type="email" id="email" name="email" placeholder="seuemail@dominio.com" required>
                    </div>

                    <div class="form-group">
                        <label for="preferencia">Modal Preferencial:</label>
                        <select id="preferencia" name="preferencia" required>
                            <option value="">Selecione uma opção...</option>
                            <option value="eco">Mais Ecológico (Menor emissão CO₂)</option>
                            <option value="rapido">Mais Rápido (Menor tempo)</option>
                            <option value="economico">Mais Econômico (Menor custo)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mensagem">Detalhes da Viagem (Origem, Destino e Datas):</label>
                        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Ex: Desejo ir de Joinville para Buenos Aires em Outubro..." required></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Enviar Solicitação</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer-main">
        <div class="container">
            <p>&copy; 2026 PagoGo - Projeto Acadêmico IFC. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
